const cv=document.getElementById('c'),ctx=cv.getContext('2d');

// ---- Web Audio: Arabic Maqam Hijaz Oud & Darbuka Synthesizer ----
let audioCtx=null,musicOn=true,musicStep=0,nextNoteTime=0;
// Maqam Hijaz on D (D3, Eb3, F#3, G3, A3, Bb3, C4, D4, Eb4, F#4)
const HIJAZ=[146.83,155.56,185.00,196.00,220.00,233.08,261.63,293.66,311.13,369.99];
const MELODY_HOUSE=[0,2,3,4, 3,2,1,0, 4,5,4,3, 2,3,1,0, 7,6,5,4, 5,4,3,2, 3,4,2,1, 0,-1,0,-1];
const MELODY_VILLAGE=[4,5,7,8, 7,5,4,3, 4,7,5,4, 3,2,3,4, 7,8,9,8, 7,5,4,3, 2,3,4,2, 1,0,1,0];
const DRUM_PAT=['D',0,'T','K', 'D','K','T',0, 'D',0,'T','K', 'D','T','K','K']; // Dum / Tak / Ka

function ensureAudio(){
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
}
function playOud(freq,time,dur){
  if(!audioCtx||!musicOn||freq<=0)return;
  const o1=audioCtx.createOscillator(),o2=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
  o1.type='triangle';o2.type='sawtooth';
  o1.frequency.setValueAtTime(freq,time);
  o2.frequency.setValueAtTime(freq*2,time); // octave double-course string
  f.type='lowpass';f.frequency.setValueAtTime(1100,time);f.frequency.exponentialRampToValueAtTime(320,time+dur);
  const g2=audioCtx.createGain();g2.gain.value=0.18;
  g.gain.setValueAtTime(0.001,time);
  g.gain.linearRampToValueAtTime(0.085,time+0.015);
  g.gain.exponentialRampToValueAtTime(0.0008,time+dur);
  o1.connect(f);o2.connect(g2);g2.connect(f);f.connect(g);g.connect(audioCtx.destination);
  o1.start(time);o2.start(time);o1.stop(time+dur);o2.stop(time+dur);
}
function playDarbuka(type,time){
  if(!audioCtx||!musicOn||!type)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  if(type==='D'){ // Dum (deep bass)
    o.type='sine';o.frequency.setValueAtTime(135,time);o.frequency.exponentialRampToValueAtTime(52,time+0.18);
    g.gain.setValueAtTime(0.11,time);g.gain.exponentialRampToValueAtTime(0.001,time+0.2);
  }else{ // Tak / Ka (crisp rim)
    o.type='triangle';o.frequency.setValueAtTime(type==='T'?440:330,time);o.frequency.exponentialRampToValueAtTime(140,time+0.07);
    g.gain.setValueAtTime(type==='T'?0.055:0.035,time);g.gain.exponentialRampToValueAtTime(0.001,time+0.08);
  }
  o.connect(g);g.connect(audioCtx.destination);o.start(time);o.stop(time+0.22);
}
function playBlip(pitch){
  if(!audioCtx||!musicOn)return;
  const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='square';o.frequency.setValueAtTime(pitch||380,t);
  g.gain.setValueAtTime(0.03,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.045);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+0.05);
}
function tickMusic(){
  if(!audioCtx||!musicOn||audioCtx.state!=='running')return;
  const stepDur=0.23;
  if(nextNoteTime<audioCtx.currentTime)nextNoteTime=audioCtx.currentTime+0.02;
  while(nextNoteTime<audioCtx.currentTime+0.12){
    const mel=cur===6?MELODY_VILLAGE:MELODY_HOUSE;
    const idx=mel[musicStep%mel.length];
    if(idx>=0)playOud(HIJAZ[idx],nextNoteTime,stepDur*1.6);
    if(musicStep%4===0)playOud(HIJAZ[0]*0.5,nextNoteTime,stepDur*3.5); // D2 drone
    playDarbuka(DRUM_PAT[musicStep%DRUM_PAT.length],nextNoteTime);
    nextNoteTime+=stepDur;
    musicStep++;
  }
}

// ---- Input: later key press takes priority per axis, like Undertale ----
const held=[];
const map={ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d',ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r'};
let interact=false;
let mapPress=false,mapOpen=false;
function down(k,rep){
  ensureAudio();
  if((k==='n'||k==='N')&&!rep){musicOn=!musicOn;return true}
  if(k==='Escape'||k==='m'||k==='M'){if(!rep)mapPress=true;return true}
  if(map[k]){const m=map[k];const i=held.indexOf(m);if(i>=0)held.splice(i,1);held.push(m);return true}
  if(k==='z'||k==='Z'||k==='Enter'){interact=true;return true}
  return false;
}
function up(k){
  if(map[k]){const i=held.indexOf(map[k]);if(i>=0)held.splice(i,1)}
}
addEventListener('keydown',e=>{if(down(e.key,e.repeat)){e.preventDefault()}});
addEventListener('keyup',e=>up(e.key));
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();down(k)});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>up(k)));
});

   {k:'npc',role:'walker1',x:120,y:164,w:16,h:8,roam:[80,220],vx:0.7,dir:'r',talk:'* "Heading to the House of Wisdom?\n  The copyists are busy today!"'},
   {k:'npc',role:'walker2',x:480,y:168,w:16,h:8,roam:[430,580],vx:-0.65,dir:'l',talk:'* "Listen to the oud by the well!\n  Nothing beats afternoon music\n  in the shade of the palms."'}

};
const BORDER=[{x:0,y:0,w:320,h:70},{x:0,y:230,w:320,h:10},{x:0,y:0,w:10,h:240},{x:310,y:0,w:10,h:240}];
function doorsOf(id){
  if(id===6)return [{x:20,y:70,w:42,h:6,to:2}]; // Village gate leads back to your Courtyard
  return [1,2,3,4,5,6].filter(i=>i!==id).map((to,k)=>({x:18+k*60,y:70,w:38,h:6,to}));
}
let cur=1,room=ROOMS[1],doors=doorsOf(1),objs=room.objs,banner=90,dlg=null,T=null,gTick=0,catPet=0,camX=0;
const P={x:160,y:206,dir:'d',frame:0,tick:0,moving:false};
function setRoom(id,from){
  cur=id;room=ROOMS[id];doors=doorsOf(id);objs=room.objs;
  const d=from?doors.find(d=>d.to===from):null;
  if(d){P.x=d.x+Math.floor(d.w/2);P.y=86}else{P.x=160;P.y=206}
  P.dir='d';banner=90;dlg=null;
  camX=room.w?Math.max(0,Math.min(room.w-320,P.x-160)):0;
}
const SPEED=3;           // px per frame @30fps, same as Frisk
const ANIM_EVERY=5;      // game frames per walk-frame

function box(x,y){return{x:x-7,y:y-6,w:14,h:6}}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function blocked(x,y){
  const b=box(x,y),rw=room.w||320;
  const walls=[{x:0,y:0,w:rw,h:70},{x:0,y:230,w:rw,h:10},{x:0,y:0,w:10,h:240},{x:rw-10,y:0,w:10,h:240}];
  for(const w of walls)if(hit(b,w))return true;
  for(const o of objs)if(hit(b,o))return true;
  return false;
}
function talkAhead(){
  const b=box(P.x,P.y);let f;
  if(P.dir==='u')f={x:b.x-2,y:b.y-14,w:b.w+4,h:14};
  else if(P.dir==='d')f={x:b.x-2,y:b.y+b.h,w:b.w+4,h:14};
  else if(P.dir==='l')f={x:b.x-14,y:b.y-6,w:14,h:b.h+8};
  else f={x:b.x+b.w,y:b.y-6,w:14,h:b.h+8};
  return objs.find(o=>(o.talk||o.talks)&&hit(f,o));
}
addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=6&&!T&&!mapOpen&&n!==cur)T={f:0,to:n,from:cur}});

function update(){
  gTick++;
  tickMusic();
  if(banner>0)banner--;
  if(mapPress){mapPress=false;if(!T&&!dlg)mapOpen=!mapOpen}
  if(mapOpen){interact=false;P.moving=false;return}
  if(T){T.f++;if(T.f===8)setRoom(T.to,T.from);if(T.f>=16)T=null;interact=false;return}
  if(dlg){
    const m=dlg.text;
    if(!dlg.done){
      dlg.shown=Math.min(m.length,dlg.shown+1);
      if(dlg.shown%3===0)playBlip(dlg.cat?540:340);
      if(dlg.shown>=m.length)dlg.done=true;
    }
    if(interact){if(dlg.done)dlg=null;else{dlg.shown=m.length;dlg.done=true}}
    interact=false;P.moving=false;return;
  }
  // Roaming village NPCs
  for(const o of objs){
    if(o.roam){
      const nx=o.x+o.vx;
      const pb=box(P.x,P.y),nb={x:nx,y:o.y,w:o.w,h:o.h};
      if(nx<o.roam[0]||nx>o.roam[1]||hit(nb,pb)){o.vx=-o.vx;o.dir=o.vx>0?'r':'l'}
      else{o.x=nx;o.dir=o.vx>0?'r':'l'}
    }
  }
  let dx=0,dy=0;
  for(const k of held){if(k==='l')dx=-1;if(k==='r')dx=1;if(k==='u')dy=-1;if(k==='d')dy=1}
  const li=held.lastIndexOf('l'),ri=held.lastIndexOf('r');
  if(li>=0&&ri>=0)dx=li>ri?-1:1;
  const ui=held.lastIndexOf('u'),di=held.lastIndexOf('d');
  if(ui>=0&&di>=0)dy=ui>di?-1:1;
  P.moving=dx!==0||dy!==0;
  if(dx<0)P.dir='l';else if(dx>0)P.dir='r';else if(dy<0)P.dir='u';else if(dy>0)P.dir='d';
  if(dx&&!blocked(P.x+dx*SPEED,P.y))P.x+=dx*SPEED;
  if(dy&&!blocked(P.x,P.y+dy*SPEED))P.y+=dy*SPEED;
  camX=room.w?Math.max(0,Math.min(room.w-320,Math.round(P.x-160))):0;
  if(P.moving){P.tick++;if(P.tick>=ANIM_EVERY){P.tick=0;P.frame=(P.frame+1)%4}}
  else{P.frame=0;P.tick=0}
  const b=box(P.x,P.y);
  for(const d of doors)if(hit(b,d)){T={f:0,to:d.to,from:cur};break}
  if(interact){
    const t=talkAhead();
    if(t){
      const msg=t.talks?t.talks[catPet++%t.talks.length]:t.talk;
      dlg={text:msg,shown:0,done:false,cat:!!t.talks};
      playBlip(t.talks?560:380);
    }
  }
  interact=false;
}

// ---- Drawing (shapes only) ----
function R(c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function C(c,x,y,r){ctx.fillStyle=c;ctx.beginPath();ctx.arc(Math.round(x),Math.round(y),r,0,7);ctx.fill()}
function E(c,x,y,rx,ry){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(Math.round(x),Math.round(y),rx,ry,0,0,7);ctx.fill()}
function arch(c,x,w,top,bot){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,bot);ctx.lineTo(x,top);ctx.arc(x+w/2,top,w/2,Math.PI,0);ctx.lineTo(x+w,bot);ctx.fill()}

function drawPlayer(){
  const x=Math.round(P.x),y=Math.round(P.y);
  const f=P.frame,step=(f===1||f===3),bob=step?1:0,legA=f===1?-2:f===3?2:0;
  const sx=x-8,sy=y-30-bob;

    const x=pos[i][0],y=pos[i][1],here=i===cur;
    R(here?'#ffd25a':'#d9b44a',x-2,y-2,W+4,H+4);R(ROOMS[i].floor[0],x,y,W,H);R(ROOMS[i].wall[0],x,y,W,10);R(ROOMS[i].acc,x,y+10,W,2);
    R('#241408',x+W/2-5,y+2,10,8);
    ctx.font='bold 10px monospace';ctx.fillStyle='#fff';ctx.fillText(LBL[i],x+W/2,y+H/2-2);
    if(here){
      const rw=ROOMS[i].w||320;
      C('#ff3b3b',x+6+(P.x/rw)*(W-12),y+12+((P.y-70)/160)*(H-16),3.5);
      ctx.fillStyle='#ffd25a';ctx.font='bold 8px monospace';ctx.fillText('YOU',x+W/2,y+H+4);
    }
  }
  ctx.font='bold 10px monospace';ctx.fillStyle='#d9b44a';ctx.fillText('Music: '+(musicOn?'ON (N to mute)':'OFF (N to play)'),160,196);ctx.fillText('Esc / M: close',160,212);
  ctx.textAlign='left';
}
function draw(){
  const rw=room.w||320;
  R('#000',0,0,320,240);
  ctx.save();
  ctx.translate(-camX,0);
  R(room.floor[0],10,70,rw-20,160);
  for(let i=0;i<rw-20;i+=20)for(let j=0;j<160;j+=20)if(((i+j)/20)%2===0)R(room.floor[1],10+i,70+j,20,20);
  for(const d of room.deco)drawRug(d);
  // walls
  R(room.wall[0],0,0,rw,70);R(room.wall[1],0,62,rw,8);
  R(room.wall[0],0,230,rw,10);R(room.wall[0],0,0,10,240);R(room.wall[0],rw-10,0,10,240);
  if(room.basement){
    for(let y=16;y<62;y+=15)R('#1d1b18',0,y,rw,2);
    for(let row=0;row<4;row++){
      const off=(row%2)*18;
      for(let x=off;x<rw;x+=36)R('#1d1b18',x,row*15+2,2,14);
    }
    for(const vx of [110,186]){
      R('#1d1b18',vx-2,10,28,16);R(room.win,vx,12,24,12);
      for(let bx=vx+4;bx<vx+22;bx+=5)R('#6e685f',bx,12,2,12);
    }
  }else if(room.yard||room.village){
    R('#6ab8e8',0,0,rw,20);
    R('#8ed0f5',0,14,rw,6);
    // Distant Baghdad mosque domes & minarets along the skyline
    for(const sx of [18,170,340,510]){
      if(sx<rw){
        C('#b8945c',sx,20,7);R('#b8945c',sx-7,17,14,4);R('#d9b44a',sx-1,11,2,3);
        R('#b8945c',sx-13,7,3,13);C('#d9b44a',sx-11.5,6,1.5);
      }
    }
    for(let x=0;x<rw;x+=16)R(room.wall[0],x,16,10,5);
    R(room.acc,0,24,rw,4);
    for(let x=4;x<rw;x+=12)R('#d9b44a',x,25,4,2);
    R('#b89056',0,44,rw,1);
    if(room.yard){
      for(const nx of [78,228]){arch('#9c7640',nx,20,34,56);arch('#b38b52',nx+2,16,35,55)}
      for(const lx of [15,301]){R('#2a1a10',lx+1,18,1,6);R('#d9b44a',lx,24,4,6);C('#ffe27a',lx+2,27,1.5)}
    }
  }else{
    for(let x=6;x<rw;x+=14){R(room.acc,x+2,6,2,6);R(room.acc,x,8,6,2)}
    R(room.acc,0,18,rw,2);R(room.acc,0,66,rw,2);
    for(const wx of [74,222]){
      arch(room.wall[1],wx-3,30,36,60);arch(room.win,wx,24,38,58);
      R('#e8dcb8',wx+11,38,2,20);R('#e8dcb8',wx,46,24,2);R('#e8dcb8',wx+4,32,16,2);
    }
  }
  // horseshoe-arch doorways
  ctx.font='bold 8px "Courier New",monospace';ctx.textBaseline='top';
  for(const d of doors){
    arch('#d9b44a',d.x-3,d.w+6,44,70);arch('#241408',d.x,d.w,44,70);
    ctx.fillStyle='#fff';ctx.fillText(NAMES[d.to],d.x+Math.round((d.w-NAMES[d.to].length*4.8)/2),58);
  }
  // objects sorted by depth, with the player in between
  const sorted=objs.slice().sort((a,b)=>(a.y+a.h)-(b.y+b.h));
  for(const o of sorted)if(o.y+o.h<=P.y)drawObj(o);
  drawPlayer();
  for(const o of sorted)if(o.y+o.h>P.y)drawObj(o);
  ctx.restore();

  // HUD & overlays (screen-space)
  if(banner>0){R('#000',8,206,236,20);ctx.font='bold 12px "Courier New",monospace';ctx.fillStyle='#fff';ctx.fillText(TITLES[cur],14,210)}
  if(room.village){
    R('rgba(0,0,0,0.65)',244,4,72,14);
    ctx.font='bold 9px "Courier New",monospace';ctx.fillStyle='#ffd25a';
    ctx.fillText(musicOn?'OUD: ON [N]':'OUD: OFF [N]',248,7);
  }
  if(dlg){
    R('#fff',16,150,288,80);R('#000',20,154,280,72);
    ctx.fillStyle='#fff';ctx.font='bold 14px "Courier New",monospace';ctx.textBaseline='top';
    dlg.text.slice(0,dlg.shown).split('\n').forEach((l,i)=>ctx.fillText(l,30,160+i*20));
  }
  if(mapOpen)drawMap();
  if(T){ctx.globalAlpha=T.f<8?T.f/8:(16-T.f)/8;R('#000',0,0,320,240);ctx.globalAlpha=1}
}

// ---- Fixed 30 FPS loop ----
let last=performance.now(),acc=0;const STEP=1000/30;
function loop(t){
  acc+=t-last;last=t;
  if(acc>250)acc=250;
  while(acc>=STEP){update();acc-=STEP}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
